name: EngineeringAI CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore EngineeringAI.slnx

      - name: Build solution
        run: dotnet build EngineeringAI.slnx --configuration Release --no-restore

      - name: Run unit tests
        run: dotnet test EngineeringAI.Tests/EngineeringAI.Tests.csproj --configuration Release --no-build --filter "FullyQualifiedName~EngineeringAI.Tests.Services"