name: EngineeringAI CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore EngineeringAI.slnx

      - name: Build solution
        run: dotnet build EngineeringAI.slnx --configuration Release --no-restore

      - name: Run unit tests
        run: dotnet test EngineeringAI.Tests/EngineeringAI.Tests.csproj --configuration Release --no-build --filter "FullyQualifiedName~EngineeringAI.Tests.Services"

      - name: Publish API
        run: dotnet publish EngineeringAI.Api/EngineeringAI.Api.csproj --configuration Release --no-build --output ./publish

      - name: Upload API artifact
        uses: actions/upload-artifact@v4
        with:
          name: engineeringai-api
          path: ./publish

      - name: Publish Azure Function
        run: dotnet publish EngineeringAI.Functions/EngineeringAI.Functions.csproj --configuration Release --no-build --output ./function-publish

      - name: Verify Function publish output
        shell: pwsh
        run: Get-ChildItem ./function-publish -Force

      - name: Upload Function artifact
        uses: actions/upload-artifact@v4
        with:
          name: engineeringai-functions
          path: ./function-publish
          include-hidden-files: true


  deploy:
    runs-on: windows-latest
    needs: build-and-test

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download API artifact
        uses: actions/download-artifact@v4
        with:
          name: engineeringai-api
          path: ./publish

      - name: Login to Azure using OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: app-engineeringai-api-dev
          package: ./publish

      - name: Download Function artifact
        uses: actions/download-artifact@v4
        with:
          name: engineeringai-functions
          path: ./function-publish

      - name: Create clean deployment package
        shell: pwsh
        run: |
          if (Test-Path "./function-deploy.zip") {
            Remove-Item "./function-deploy.zip"
          }

          Push-Location ./function-publish
          Get-ChildItem -Force | Compress-Archive -DestinationPath ../function-deploy.zip -Force
          Pop-Location

      - name: Deploy Azure Function
        uses: Azure/functions-action@v1
        with:
          app-name: func-engineeringai-dev-001
          package: ./function-publish

